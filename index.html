<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Financial Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fa;
    color: #101828;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: #475467; margin: 0 0 14px; }

  .monthnav { display: flex; align-items: center; gap: 8px; }
  .monthnav select { min-width: 160px; }
  .arrow { width: 36px; height: 36px; padding: 0; font-size: 14px; }

  /* ---------- summary cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .card {
    background: #fff; border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(16,24,40,.08); border-left: 4px solid #98a2b3;
  }
  .card span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #667085; margin-bottom: 6px; }
  .card strong { font-size: 24px; font-weight: 700; }
  .card.income  { border-left-color: #2f9e44; } .card.income  strong { color: #2f9e44; }
  .card.expense { border-left-color: #e15759; } .card.expense strong { color: #e15759; }
  .card.saved   { border-left-color: #4e79a7; } .card.saved   strong { color: #4e79a7; }
  .card.saved strong.neg { color: #e15759; }

  /* ---------- panels ---------- */
  .panel {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 1px 3px rgba(16,24,40,.08); margin-bottom: 20px;
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; }

  /* ---------- form ---------- */
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: #475467; gap: 6px; }
  input, select {
    font: inherit; padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 9px;
    background: #fff; color: #101828; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid #b6d0ee; border-color: #4e79a7; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 9px; }
  .btn-primary { background: #4e79a7; color: #fff; padding: 10px 20px; font-weight: 600; }
  .btn-primary:hover { background: #3f6288; }
  .btn-ghost { background: #fff; border: 1px solid #d0d5dd; color: #475467; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .btn-ghost:hover { background: #f9fafb; }

  /* ---------- savings target ---------- */
  .target-row { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; }
  .progress { height: 16px; background: #eef1f6; border-radius: 999px; overflow: hidden; }
  .progress > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #4e79a7, #2f9e44);
    border-radius: 999px; transition: width .35s ease;
  }
  .progress > i.neg  { background: linear-gradient(90deg, #e15759, #f28e2b); }
  .progress > i.full { background: linear-gradient(90deg, #2f9e44, #8cd17d); }
  .ptext { margin-top: 9px; font-size: 13px; color: #475467; }
  .ptext b { color: #101828; }
  .muted { color: #98a2b3; font-style: italic; }
  .good { color: #2f9e44; font-weight: 600; }

  /* ---------- charts ---------- */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chartbox { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(16,24,40,.08); }
  .chartflex { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  canvas { width: 190px; height: 190px; flex: 0 0 auto; }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1 1 190px; display: grid; gap: 9px; font-size: 13px; }
  .legend li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; }
  .legend .sw { width: 14px; height: 14px; border-radius: 4px; }
  .legend .val { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
  .legend .val b { font-size: 13px; }
  .legend .val em { font-style: normal; font-size: 11px; color: #667085; }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #667085; padding: 8px 10px; border-bottom: 1px solid #eaecf0; }
  td { padding: 10px; border-bottom: 1px solid #f2f4f7; }
  tbody tr:hover td { background: #fafbfc; }
  .right { text-align: right; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; text-transform: capitalize; }
  .badge.income  { background: #e7f6ec; color: #2f9e44; }
  .badge.expense { background: #fdecec; color: #e15759; }
  .amt { font-weight: 700; white-space: nowrap; }
  .amt.income  { color: #2f9e44; }
  .amt.expense { color: #e15759; }
  .note-cell { color: #667085; }
  .del { background: transparent; color: #98a2b3; font-size: 15px; padding: 2px 8px; border-radius: 6px; }
  .del:hover { background: #fdecec; color: #e15759; }
  .empty { text-align: center; color: #98a2b3; padding: 26px 0; font-style: italic; }

  /* ---------- monthly overview ---------- */
  #overviewTable tbody tr { cursor: pointer; }
  #overviewTable tbody tr.active td { background: #eef4fa; font-weight: 600; }
  #overviewTable tfoot td { font-weight: 700; border-top: 2px solid #eaecf0; border-bottom: none; }
  .mini { display: inline-block; width: 64px; height: 8px; background: #eef1f6; border-radius: 999px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .mini i { display: block; height: 100%; background: #4e79a7; border-radius: 999px; }

  @media (max-width: 820px) {
    .charts { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
    .target-row { grid-template-columns: 1fr; gap: 14px; }
    canvas { width: 160px; height: 160px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>💰 Financial Tracker</h1>
    <div class="monthnav">
      <button id="prevMonth" class="btn-ghost arrow" title="Previous month">◀</button>
      <select id="monthFilter" aria-label="Month"></select>
      <button id="nextMonth" class="btn-ghost arrow" title="Next month">▶</button>
    </div>
  </header>

  <!-- SUMMARY -->
  <section class="cards">
    <div class="card income"><span>Income</span><strong id="totalIncome">0</strong></div>
    <div class="card expense"><span>Expenses</span><strong id="totalExpense">0</strong></div>
    <div class="card saved"><span>Saved</span><strong id="totalSaved">0</strong></div>
  </section>

  <!-- SAVINGS TARGET -->
  <section class="panel">
    <h2>🎯 Savings target — <span id="targetMonthLabel"></span></h2>
    <div class="target-row">
      <label>Target for this month
        <input type="number" id="targetInput" min="0" step="0.01" placeholder="e.g. 5000">
      </label>
      <div>
        <div class="progress"><i id="progressBar"></i></div>
        <div class="ptext" id="progressText"></div>
      </div>
    </div>
  </section>

  <!-- ADD ENTRY -->
  <section class="panel">
    <h2>Add entry for <span id="formMonthLabel"></span></h2>
    <form id="entryForm">
      <div class="row">
        <label>Date<input type="date" id="date" required></label>
        <label>Type
          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
        <label>Category<select id="category"></select></label>
        <label>Amount<input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required></label>
        <label>Note<input type="text" id="note" placeholder="optional"></label>
        <button class="btn-primary" type="submit">Add</button>
      </div>
    </form>
  </section>

  <!-- CHARTS -->
  <section class="charts">
    <div class="chartbox">
      <h2>Expenses by category</h2>
      <div class="chartflex">
        <canvas id="expensePie"></canvas>
        <ul class="legend" id="expenseLegend"></ul>
      </div>
    </div>
    <div class="chartbox">
      <h2>Income by category</h2>
      <div class="chartflex">
        <canvas id="incomePie"></canvas>
        <ul class="legend" id="incomeLegend"></ul>
      </div>
    </div>
  </section>

  <!-- ENTRIES -->
  <section class="panel">
    <div class="panel-head">
      <h2>Entries — <span id="entryMonthLabel"></span></h2>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost" id="exportBtn">Export CSV</button>
        <button class="btn-ghost" id="clearBtn">Clear all</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Type</th><th>Category</th><th>Note</th>
            <th class="right">Amount</th><th></th>
          </tr>
        </thead>
        <tbody id="entryTable"></tbody>
      </table>
    </div>
  </section>

  <!-- MONTHLY OVERVIEW -->
  <section class="panel">
    <h2>📅 Monthly overview</h2>
    <div class="table-wrap" style="margin-top:0;">
      <table id="overviewTable">
        <thead>
          <tr>
            <th>Month</th>
            <th class="right">Income</th>
            <th class="right">Expenses</th>
            <th class="right">Saved</th>
            <th class="right">Target</th>
            <th class="right">Progress</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </section>

</div>

<script>
/* ============================================================
   1. CONFIG — edit to change currency or categories
   ============================================================ */
const CURRENCY = '$';                      // '₹', '€', 'Rs ', etc.

const STORAGE_KEY = 'finance-tracker-v1';  // entries
const TARGET_KEY  = 'finance-targets-v1';  // savings targets per month

const CATEGORIES = {
  income:  ['Salary', 'Class Fee'],
  expense: ['Internet', 'Insurance', 'Traveling', 'Food', 'Medicine']
};

const COLORS = {
  income:  { 'Salary': '#2f9e44', 'Class Fee': '#1c7ed6' },
  expense: { 'Internet': '#4e79a7', 'Insurance': '#f28e2b', 'Traveling': '#59a14f',
             'Food': '#e15759', 'Medicine': '#b07aa1' }
};
const FALLBACK = ['#76b7b2', '#edc948', '#ff9da7', '#9c755f', '#bab0ac', '#8cd17d'];

function colorFor(type, cat) {
  if (COLORS[type] && COLORS[type][cat]) return COLORS[type][cat];
  let h = 0;
  for (const ch of cat) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return FALLBACK[h % FALLBACK.length];
}

/* ============================================================
   2. STATE
   ============================================================ */
const $ = id => document.getElementById(id);

let entries = [];
try {
  const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (Array.isArray(raw)) entries = raw;
} catch (e) { entries = []; }

let targets = {};
try {
  const raw = JSON.parse(localStorage.getItem(TARGET_KEY));
  if (raw && typeof raw === 'object') targets = raw;
} catch (e) { targets = {}; }

const monthSel   = $('monthFilter');
const form       = $('entryForm');
const dateInput  = $('date');
const typeSel    = $('type');
const categorySel= $('category');
const amountIn   = $('amount');
const noteIn     = $('note');
const targetInput= $('targetInput');
const tbody      = $('entryTable');

const fmt = n => CURRENCY + Number(n).toLocaleString(undefined,
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const saveEntries = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
const saveTargets = () => localStorage.setItem(TARGET_KEY, JSON.stringify(targets));

/* ---------- date helpers ---------- */
const isoDate = d =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const todayMonth = () => isoDate(new Date()).slice(0, 7);

function monthLabel(m) {
  const [y, mo] = m.split('-');
  return new Date(+y, +mo - 1, 1).toLocaleString(undefined, { month: 'short', year: 'numeric' });
}

function monthAdd(m, delta) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

/* default date for the entry form inside a given month */
function defaultDateFor(m) {
  const now = new Date();
  return (m === todayMonth()) ? isoDate(now) : m + '-01';
}

let currentMonth = todayMonth();

/* ============================================================
   3. DATA HELPERS
   ============================================================ */
const monthEntries = m => entries.filter(e => e.date.startsWith(m));

function totals(list) {
  const income  = list.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const expense = list.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  return { income, expense, saved: income - expense };
}

function allMonths() {
  const set = new Set(entries.map(e => e.date.slice(0, 7)));
  Object.keys(targets).forEach(m => { if (targets[m] > 0) set.add(m); });
  set.add(currentMonth);
  set.add(todayMonth());
  return [...set].sort().reverse();
}

/* ============================================================
   4. PIE / DONUT CHART (canvas, no libraries)
   ============================================================ */
function drawPie(canvas, data, total) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 190;
  const h = canvas.clientHeight || 190;

  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 4;

  if (!total) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#eef1f6';
    ctx.fill();
    ctx.fillStyle = '#98a2b3';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No data', cx, cy);
    return;
  }

  let start = -Math.PI / 2;
  data.forEach(d => {
    const angle = (d.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    start += angle;
  });

  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.58, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  const text = fmt(total);
  let fs = Math.round(r * 0.26);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${fs}px system-ui, sans-serif`;
  while (ctx.measureText(text).width > r * 1.05 && fs > 8) {
    fs--;
    ctx.font = `700 ${fs}px system-ui, sans-serif`;
  }
  ctx.fillStyle = '#101828';
  ctx.fillText(text, cx, cy);
}

function renderLegend(ul, data, total) {
  ul.innerHTML = '';
  if (!data.length) {
    ul.innerHTML = '<li class="muted">No entries this month</li>';
    return;
  }
  data.forEach(d => {
    const pct = (d.value / total * 100).toFixed(1);
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="sw" style="background:${d.color}"></span>` +
      `<span>${esc(d.label)}</span>` +
      `<span class="val"><b>${pct}%</b><em>${fmt(d.value)}</em></span>`;
    ul.appendChild(li);
  });
}

function buildData(list, type) {
  const sums = new Map();
  list.filter(e => e.type === type)
      .forEach(e => sums.set(e.category, (sums.get(e.category) || 0) + e.amount));

  return [...sums.entries()]
    .map(([label, value]) => ({ label, value, color: colorFor(type, label) }))
    .sort((a, b) => b.value - a.value);
}

function renderCharts(list) {
  [
    { type: 'income',  canvas: $('incomePie'),  legend: $('incomeLegend')  },
    { type: 'expense', canvas: $('expensePie'), legend: $('expenseLegend') }
  ].forEach(({ type, canvas, legend }) => {
    const data = buildData(list, type);
    const total = data.reduce((s, d) => s + d.value, 0);
    drawPie(canvas, data, total);
    renderLegend(legend, data, total);
  });
}

/* ============================================================
   5. RENDERERS
   ============================================================ */
function renderSavings(saved) {
  const tgt = targets[currentMonth] || 0;
  if (document.activeElement !== targetInput) {
    targetInput.value = tgt > 0 ? tgt : '';
  }

  const bar = $('progressBar');
  const txt = $('progressText');

  if (!(tgt > 0)) {
    bar.style.width = '0%';
    bar.className = '';
    txt.innerHTML = '<span class="muted">No target set for this month — enter an amount on the left.</span>';
    return;
  }

  const pct = saved / tgt * 100;
  bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  bar.classList.toggle('neg', saved < 0);
  bar.classList.toggle('full', pct >= 100);

  const diff = tgt - saved;
  txt.innerHTML =
    `<b>${fmt(saved)}</b> saved of <b>${fmt(tgt)}</b> · <b>${pct.toFixed(0)}%</b> ` +
    (diff > 0
      ? `<span class="muted">(${fmt(diff)} to go)</span>`
      : `<span class="good">🎉 target reached, ${fmt(-diff)} extra</span>`);
}

function renderTable(list) {
  const sorted = [...list].reverse().sort((a, b) => b.date.localeCompare(a.date));

  if (!sorted.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No entries in this month yet — add one above.</td></tr>';
    return;
  }

  tbody.innerHTML = sorted.map(e => `
    <tr>
      <td>${esc(e.date)}</td>
      <td><span class="badge ${e.type}">${e.type}</span></td>
      <td>${esc(e.category)}</td>
      <td class="note-cell">${e.note ? esc(e.note) : '—'}</td>
      <td class="right amt ${e.type}">${e.type === 'income' ? '+' : '−'}${fmt(e.amount)}</td>
      <td class="right"><button class="del" data-id="${esc(e.id)}" title="Delete">✕</button></td>
    </tr>`).join('');
}

function renderOverview() {
  const months = allMonths();
  const tbodyEl = $('overviewTable').querySelector('tbody');
  const tfootEl = $('overviewTable').querySelector('tfoot');

  let tInc = 0, tExp = 0, tSaved = 0, tTgt = 0;

  tbodyEl.innerHTML = months.map(m => {
    const t = totals(monthEntries(m));
    const tgt = targets[m] || 0;
    const pct = tgt > 0 ? (t.saved / tgt * 100) : null;

    tInc += t.income; tExp += t.expense; tSaved += t.saved; tTgt += tgt;

    const progress = tgt > 0
      ? `<span class="mini"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>${pct.toFixed(0)}%`
      : '<span class="muted">—</span>';

    return `<tr data-month="${m}" class="${m === currentMonth ? 'active' : ''}">
      <td>${monthLabel(m)}</td>
      <td class="num">${fmt(t.income)}</td>
      <td class="num">${fmt(t.expense)}</td>
      <td class="num" style="color:${t.saved < 0 ? '#e15759' : '#2f9e44'}">${fmt(t.saved)}</td>
      <td class="num">${tgt > 0 ? fmt(tgt) : '—'}</td>
      <td class="num">${progress}</td>
    </tr>`;
  }).join('');

  tfootEl.innerHTML = `<tr>
      <td>Total</td>
      <td class="num">${fmt(tInc)}</td>
      <td class="num">${fmt(tExp)}</td>
      <td class="num" style="color:${tSaved < 0 ? '#e15759' : '#2f9e44'}">${fmt(tSaved)}</td>
      <td class="num">${tTgt > 0 ? fmt(tTgt) : '—'}</td>
      <td class="num"></td>
    </tr>`;
}

function refreshMonthSelect() {
  const months = allMonths();
  monthSel.innerHTML = months
    .map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  monthSel.value = currentMonth;
}

function renderAll() {
  const list = monthEntries(currentMonth);
  const t = totals(list);

  $('totalIncome').textContent  = fmt(t.income);
  $('totalExpense').textContent = fmt(t.expense);
  const savedEl = $('totalSaved');
  savedEl.textContent = fmt(t.saved);
  savedEl.classList.toggle('neg', t.saved < 0);

  const label = monthLabel(currentMonth);
  $('targetMonthLabel').textContent = label;
  $('formMonthLabel').textContent   = label;
  $('entryMonthLabel').textContent  = label;

  renderSavings(t.saved);
  renderCharts(list);
  renderTable(list);
  renderOverview();
  refreshMonthSelect();
}

/* ============================================================
   6. MONTH NAVIGATION
   ============================================================ */
function setMonth(m) {
  currentMonth = m;
  dateInput.value = defaultDateFor(m);
  renderAll();
}

$('prevMonth').addEventListener('click', () => setMonth(monthAdd(currentMonth, -1)));
$('nextMonth').addEventListener('click', () => setMonth(monthAdd(currentMonth, 1)));
monthSel.addEventListener('change', () => setMonth(monthSel.value));

/* ============================================================
   7. FORM & CATEGORIES
   ============================================================ */
function fillCategoryOptions() {
  categorySel.innerHTML = CATEGORIES[typeSel.value]
    .map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
typeSel.addEventListener('change', fillCategoryOptions);

form.addEventListener('submit', ev => {
  ev.preventDefault();

  const amount = parseFloat(amountIn.value);
  if (!(amount > 0)) { alert('Please enter an amount greater than 0.'); return; }

  const date = dateInput.value || defaultDateFor(currentMonth);

  entries.push({
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
    date,
    type: typeSel.value,
    category: categorySel.value,
    amount: Math.round(amount * 100) / 100,
    note: noteIn.value.trim()
  });
  saveEntries();

  // if the entry belongs to another month, jump to that month
  const mk = date.slice(0, 7);
  if (mk !== currentMonth) currentMonth = mk;

  dateInput.value = defaultDateFor(currentMonth);
  renderAll();

  amountIn.value = '';
  noteIn.value = '';
  amountIn.focus();
});

/* ============================================================
   8. SAVINGS TARGET INPUT
   ============================================================ */
targetInput.addEventListener('input', () => {
  const v = parseFloat(targetInput.value);

  if (!isFinite(v) || v <= 0) delete targets[currentMonth];
  else targets[currentMonth] = Math.round(v * 100) / 100;

  saveTargets();

  const t = totals(monthEntries(currentMonth));
  renderSavings(t.saved);
  renderOverview();
  refreshMonthSelect();
});

/* ============================================================
   9. DELETE / EXPORT / CLEAR
   ============================================================ */
tbody.addEventListener('click', ev => {
  const btn = ev.target.closest('.del');
  if (!btn) return;
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => String(e.id) !== String(btn.dataset.id));
  saveEntries();
  renderAll();
});

$('overviewTable').addEventListener('click', ev => {
  const tr = ev.target.closest('tr[data-month]');
  if (tr) setMonth(tr.dataset.month);
});

$('exportBtn').addEventListener('click', () => {
  const rows = [['Date', 'Type', 'Category', 'Amount', 'Note']];
  [...monthEntries(currentMonth)]
    .reverse()
    .sort((a, b) => b.date.localeCompare(a.date))
    .forEach(e => rows.push([e.date, e.type, e.category, e.amount, e.note || '']));

  const csv = rows
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `financial-tracker-${currentMonth}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

$('clearBtn').addEventListener('click', () => {
  if (!confirm('Delete ALL entries and ALL targets permanently? This cannot be undone.')) return;
  entries = [];
  targets = {};
  saveEntries();
  saveTargets();
  renderAll();
});

/* ============================================================
   10. RESIZE + START
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderCharts(monthEntries(currentMonth)), 150);
});

dateInput.value = defaultDateFor(currentMonth);
fillCategoryOptions();
renderAll();
</script>
</body>
</html>
